<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Local Game</title>
    <link rel="stylesheet" href="stylez.css">
</head>

<body data-mode="ai">

    <button class="back-btn" onclick="goBack()">⬅ Back</button>

    <div class="container">
        <h1 class="title">AI Mode</h1>

        <div class="difficulty">
            <button class="diff-btn active" onclick="setDifficulty('easy', this)">Easy</button>
            <button class="diff-btn" onclick="setDifficulty('hard', this)">Hard</button>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score x-score">X: <span id="scoreX">0</span></div>
            <div class="score o-score">O: <span id="scoreO">0</span></div>
        </div>

        <!-- Board -->
        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <h2 id="status">Player X's Turn</h2>
    </div>

    <script src="script.js"></script>
</body>

</html>
